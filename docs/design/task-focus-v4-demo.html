  }
  for(const r of rs){const m=messages.get(r.id),name=roomName(r.room,state.user,true);
   if(!origins.has(r.id)&&matches([c.title,name,people[r.by],r.time,m.text].join(' ')))origins.set(r.id,{type:'source',uid:'s-'+r.id,key:c.key,id:r.id,title:name+' · '+people[r.by],subtitle:r.time+' · '+m.text,time:r.time});
  }
 }
 const sort=(a,b)=>b.time.localeCompare(a.time)||a.uid.localeCompare(b.uid);
 return [...items.sort(sort),...[...origins.values()].sort(sort)];
}
function drawQuick(){
 const panel=byId('quick-panel'),input=byId('quick-input'),trigger=byId('jump-trigger'),work=byId('window-work');
 panel.hidden=!quickOpen;byId('jump-backdrop').hidden=!quickOpen;work.inert=quickOpen;
 trigger.setAttribute('aria-expanded',String(quickOpen));input.setAttribute('aria-expanded',String(quickOpen));
 if(!quickOpen){input.value='';input.removeAttribute('aria-activedescendant');byId('quick-results').replaceChildren();byId('quick-state').textContent='';resultSet=[];return;}
 if(input.value!==quickText)input.value=quickText;
 resultSet=queryResults();if(!resultSet.some(r=>r.uid===quickSelected))quickSelected=resultSet[0]?.uid||'';
 const list=byId('quick-results');
 list.innerHTML=resultSet.map((r,i)=>'<div class="q-row" id="opt-'+r.uid+'" role="option" aria-selected="'+(r.uid===quickSelected)+'" data-action="quick-pick" data-id="'+r.uid+'"><span class="q-icon">'+icon(r.type==='item'?'board':'chat',true)+'</span><span><b>'+esc(r.title)+'</b><small>'+esc(r.subtitle)+'</small></span><span class="category">'+(r.type==='item'?'事项':'原消息')+'</span></div>').join('')||'<p class="empty">没有匹配的事项或原消息</p>';
 byId('quick-state').textContent=(boardMode==='archive'?'已归档':'当前事项')+' · '+resultSet.length+' 个结果';
 if(quickSelected)input.setAttribute('aria-activedescendant','opt-'+quickSelected);else input.removeAttribute('aria-activedescendant');
 list.scrollTop=quickTop;
}
function openQuick(){
 if(!current().enabled)return;
 if(!isBoardOpen())showBoard();rememberPosition();
 if(!quickOpen){quickOpen=true;quickText='';quickSelected='';quickTop=0;}
 drawQuick();focusOn(byId('quick-input'));
}
function closeQuick(){
 if(!quickOpen)return;quickOpen=false;quickText='';quickSelected='';quickTop=0;drawQuick();
 focusOn(byId('jump-trigger'));
}
function pickResult(uid,el){
 const hit=resultSet.find(r=>r.uid===uid);if(!hit)return;quickSelected=hit.uid;
 if(hit.type==='item')openDetail(hit.key);else jumpSource(hit.key,hit.id,el||byId('quick-input'));
}
function moveOption(delta){
 if(!resultSet.length)return;
 const i=resultSet.findIndex(r=>r.uid===quickSelected),next=Math.max(0,Math.min(resultSet.length-1,i+delta));quickSelected=resultSet[next].uid;
 const list=byId('quick-results');quickTop=list.scrollTop;drawQuick();
 byId('opt-'+quickSelected)?.scrollIntoView({block:'nearest'});quickTop=list.scrollTop;
}
function clearWindowContents(){
 byId('board-pane').replaceChildren();byId('drawer').replaceChildren();byId('drawer').hidden=true;byId('win-sub').textContent='';
 byId('quick-input').value='';drawQuick();byId('window-work').classList.remove('has-detail');byId('board-pane').inert=false;
}
function drawWindow(){
 if(!isBoardOpen()||!current().enabled)return;
 if(detailKey&&!ownItem(detailKey))detailKey='';
 drawBoard();drawInspector();
 byId('window-work').classList.toggle('has-detail',!!detailKey);byId('board-pane').scrollTop=boardTop;
 byId('board-pane').inert=!!detailKey&&layeredDetail();drawQuick();
}
function openPrompt(kind){
 stop();drawDemo();promptKind=kind;const d=byId('prompt'),settings=kind==='settings';
 d.innerHTML='<h2 id="prompt-title">'+(settings?'任务秘书设置':'重置场景演示')+'</h2><p>'+(settings?esc(people[state.user])+'的秘书只整理本人可见的工作消息。暂停后停止更新，已有事项和归档记录保留。':'将两个演示账号的看板、归档和消息进度恢复到初始状态。')+'</p><div class="actions"><button class="outline" data-action="prompt-close">取消</button><button class="primary" data-action="'+(settings?'disable':'reset-confirm')+'">'+(settings?'暂停秘书':'重置演示')+'</button></div>';
 if(!d.open)d.showModal();
}
function closePrompt(){promptKind='';const d=byId('prompt');if(d.open)d.close();d.innerHTML='';}
function refresh(){
 const old=document.activeElement,token=focusToken(old);rememberPosition();
 drawSide();drawBar();drawChat();drawDemo();if(isBoardOpen())drawWindow();
 if(old&&!old.isConnected)focusOn(findFocus(token));
}
function stepBack(){
 if(quickOpen)closeQuick();else if(detailKey)closeDetail();else hideBoard('dismiss');
}
document.addEventListener('click',e=>{
 if(e.target===byId('float-stage')){hideBoard('dismiss');return;}
 if(e.target===byId('jump-backdrop')){closeQuick();return;}
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action,id=b.dataset.id;
 if(a==='menu-open'){menu=true;drawSide();focusOn(byId('side').querySelector('.mobile-only'));return;}
 if(a==='menu-close'){menu=false;drawSide();focusOn(byId('bar').querySelector('[data-action="menu-open"]'));return;}
 if(a==='room')return openRoom(id,'');
 if(a==='board')return showBoard();
 if(a==='board-close')return hideBoard('dismiss');
 if(a==='quick')return openQuick();
 if(a==='quick-close')return closeQuick();
 if(a==='quick-pick')return pickResult(id,b);
 if(a==='enable'){enable();resetWindowState();menu=false;drawChat();drawDemo();showBoard();return;}
 if(a==='settings'||a==='reset')return openPrompt(a);
 if(a==='prompt-close')return closePrompt();
 if(a==='disable'){
  closePrompt();if(isBoardOpen())hideBoard('switch');disable();resetWindowState();clearWindowContents();menu=smallScreen();clearToast();refresh();persistNav();return;
 }
 if(a==='reset-confirm'){
  closePrompt();if(isBoardOpen())hideBoard('switch');stop();clearToast();drafts.clear();state=fresh();resetWindowState();clearWindowContents();
  roomId='release';highlight='';menu=smallScreen();save();refresh();persistNav();return;
 }
 if(a==='tab'){boardMode=id;focusCard=detailKey='';boardTop=detailTop=0;drawWindow();focusOn(byId('board-pane').querySelector('[data-action="tab"][data-id="'+id+'"]'));persistNav();return;}
 if(a==='lane'){mobileLane=b.dataset.lane;boardTop=0;drawWindow();focusOn(byId('board-pane').querySelector('.mtab[data-lane="'+mobileLane+'"]'));persistNav();return;}
 if(a==='detail')return openDetail(b.dataset.key);
 if(a==='detail-close')return closeDetail();
 if(a==='archive')return archive();
 if(a==='source')return jumpSource(b.dataset.key,id,b);
 if(a==='next'){stop();advance();return;}
 if(a==='play')return togglePlayback();
});
document.addEventListener('change',e=>{
 if(e.target.id==='identity')switchUser(e.target.value);
 if(e.target.id==='source-filter'){sourceFilter=e.target.value;detailKey=focusCard='';boardTop=detailTop=0;drawWindow();focusOn(byId('source-filter'));persistNav();}
});
document.addEventListener('input',e=>{
 if(e.target.id==='quick-input'){quickText=e.target.value;quickTop=0;quickSelected='';drawQuick();}
 if(e.target.id==='room-draft')drafts.set(state.user+'/'+roomId,e.target.value);
});
layer().addEventListener('cancel',e=>{e.preventDefault();stepBack();});
const prompt=byId('prompt');
prompt.addEventListener('cancel',e=>{e.preventDefault();closePrompt();});
prompt.addEventListener('click',e=>{if(e.target===prompt){const r=prompt.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePrompt();}});
document.addEventListener('keydown',e=>{
 if(e.isComposing||e.keyCode===229||prompt.open)return;
 if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='k'&&current().enabled){
  const editing=e.target instanceof Element&&e.target.closest('input,textarea,[contenteditable="true"]');
  if(editing&&e.target.id!=='quick-input')return;
  e.preventDefault();openQuick();return;
 }
 if(quickOpen&&isBoardOpen()&&e.target===byId('quick-input')){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();moveOption(e.key==='ArrowDown'?1:-1);return;}
  if(e.key==='Enter'){e.preventDefault();pickResult(quickSelected,e.target);return;}
 }
 if(e.key==='Escape'&&isBoardOpen()){e.preventDefault();stepBack();return;}
 if(e.key==='Escape'&&menu){menu=false;drawSide();}
});
const mobileMedia=window.matchMedia('(max-width:760px)'),inspectorMedia=window.matchMedia('(max-width:1120px)');
mobileMedia.addEventListener('change',()=>{menu=false;refresh();});inspectorMedia.addEventListener('change',()=>refresh());
window.addEventListener('pagehide',()=>{rememberPosition();persistNav();});
if(window.ResizeObserver)new ResizeObserver(entries=>{const h=entries[0].target.getBoundingClientRect().height;document.documentElement.style.setProperty('--demo-height',h+'px');}).observe(byId('demo'));
byId('window-symbol').innerHTML=icon('board');byId('window-close').innerHTML=icon('close');byId('quick-close').innerHTML=icon('close',true);
document.querySelectorAll('.search-icon').forEach(el=>el.innerHTML=icon('search',true));byId('shortcut-label').textContent=/Mac|iPhone|iPad/i.test(navigator.platform)?'⌘ K':'Ctrl K';
const remembered=readNav();refresh();if(current().enabled&&remembered!==false)showBoard();
</script><noscript>请在启用 JavaScript 的浏览器中打开此单文件演示。</noscript>
